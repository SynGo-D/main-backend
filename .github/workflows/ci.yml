name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This service has no test suite yet, so the typecheck is the only
      # thing standing between a mistake and production. It is run in
      # earnest: the gateway controllers are where a session's userId is
      # turned into a downstream call, and `tsx` does not typecheck at all
      # during development.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: main-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
